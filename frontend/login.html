<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Crust &amp; Crumb Bakery</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="login">
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">C&amp;C</span>
        <span class="brand-title">Crust &amp; Crumb Bakery</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">☰</button>
      <nav class="main-nav" id="main-nav">
        <a href="index.html#menu">Menu</a>
        <span id="nav-auth" class="nav-auth"></span>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-art"><div><h2>Welcome back to the bakery.</h2><p>Track your pre-orders and reorder your favourites in a tap.</p></div></div>
    <div class="auth-panel">
      <div class="auth-card">
        <p class="eyebrow">Log in</p>
        <h1>Good to see you</h1>
        <p class="muted">Bakers are redirected to the management dashboard automatically.</p>
        <div id="form-message" class="hidden"></div>
        <form id="login-form" novalidate>
          <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required /></div>
          <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required /></div>
          <button class="btn btn-primary btn-block" type="submit">Log in</button>
        </form>
        <p class="center muted" style="margin-top:1.2rem">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
